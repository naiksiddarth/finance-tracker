$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/refresh'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.accessToken) {
        pm.collectionVariables.set("accessToken", json.data.accessToken);
      }
